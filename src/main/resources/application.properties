server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:mem:vulndb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.h2.console.enabled=false

app.credentials.aws-access-key-id=${AWS_ACCESS_KEY_ID}
app.credentials.aws-secret-access-key=${AWS_SECRET_ACCESS_KEY}
app.credentials.jwt-secret=${JWT_SECRET}
app.credentials.ssh-private-key=${SSH_PRIVATE_KEY}
app.credentials.api-token=${API_TOKEN}

app.crypto.aes-key-base64=${AES_KEY_BASE64}

app.ssrf.allowed-hosts=example.com,example.test
